[project]
name = "cybersecurity-python-labs"
version = "0.1.0"
description = "Cybersecurity Python Labs — Lab 3: FastAPI + SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100



[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["labs", "shared"]