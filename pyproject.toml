[project]
name = "cybersecurity-python-labs"
version = "0.1.0"
description = "Cybersecurity Python Labs — Lab 3: FastAPI + SQLite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "pydantic==2.9.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "D", "T20"]
ignore = ["D100", "D104", "D107", "D401", "T201"]

[tool.ruff.per-file-ignores]
"labs/lab03/seed.py" = ["T201"]
"labs/lab03/database.py" = ["T201"]
"labs/lab03/main.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.isort]
known-first-party = ["labs", "shared"]